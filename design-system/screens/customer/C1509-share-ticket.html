<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zixom Connect - C1509 Share ticket summary</title>
<link rel="icon" href="../../assets/brand/zixom-logo-small.png">
<link rel="stylesheet" href="../../assets/css/zixom.css">
<style>
.summary-text{margin:0; padding:14px 16px; border-radius:var(--r-lg); background:var(--field); border:1px solid var(--line);
  font:400 var(--fs-14)/1.6 var(--font-body); color:var(--slate-900); white-space:pre-wrap}
</style>
</head>
<body class="plate">

<div class="plate-label"><b>C1509 Share ticket summary</b><span>customer</span><span class="plate-tag">PHASE 1</span></div>
<div class="plate-states" id="pick"><span>ticket</span></div>
<div class="plate-states"><span>state</span>
  <button type="button" data-state="ready" aria-pressed="true" data-open="share">ready</button>
  <button type="button" data-state="offline" aria-pressed="false" data-open="share">offline</button>
</div>

<div class="device">
  <div class="screen" data-state="ready">
    <div class="status"></div>
    <div class="sheet">
      <div class="navbar">
        <a class="icon-btn" id="back" href="C508-request-detail.html" aria-label="Back"><svg class="ic" aria-hidden="true"><use href="#ph-arrow-left"/></svg></a>
        <h1 class="mono" id="nav-title"></h1><span></span>
      </div>
      <div class="scroll"><div id="card"></div></div>
    </div>
    <span class="home-indicator"></span>

    <div class="overlay bottom" id="share" data-initial>
      <div class="bottom-sheet" role="dialog" aria-labelledby="sh-title">
        <span class="grabber"></span>
        <div class="head"><h3 id="sh-title">Share summary</h3><button class="icon-btn sm" type="button" data-close aria-label="Close"><svg class="ic ic-18" aria-hidden="true"><use href="#ph-x"/></svg></button></div>
        <div class="offline-strip" style="margin:0 0 12px" data-when="offline"><svg class="ic ic-16" aria-hidden="true"><use href="#ph-wifi-slash"/></svg>You are offline. Summary from 11:42 AM.</div>
        <div class="body"><p class="summary-text" id="summary"></p></div>
        <div class="btn-pair" style="margin-top:16px">
          <button class="icon-btn" type="button" aria-label="Copy summary" data-toast="Copied"><svg class="ic" aria-hidden="true"><use href="#ph-copy"/></svg></button>
          <button class="btn btn-primary" type="button" data-close><svg class="ic" aria-hidden="true"><use href="#ph-share-network"/></svg>Share</button>
        </div>
      </div>
    </div>
  </div>
</div>

<p class="plate-note">Plain text for WhatsApp or email: number, machine, status, engineer and visit. It never contains prices.</p>

<script src="../../assets/icons/icons.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/render.js"></script>
<script>
(() => {
  const R = ZX.render;
  const { data } = ZX;
  const $ = (id) => document.getElementById(id);
  const PICKS = [['TKT-2026-0123', 'engineer assigned'], ['TKT-2026-0120', 'no engineer yet'], ['TKT-2026-0129', 'resolved']];

  const number = new URLSearchParams(location.search).get('ticket') || PICKS[0][0];
  const t = data.tickets.find((x) => x.number === number);
  const m = R.machine(t.machine);
  const eng = t.engineer ? R.engineer(t.engineer) : null;
  const site = data.companies.find((c) => c.id === m.company).sites.find((s) => s.id === m.site);

  $('pick').insertAdjacentHTML('beforeend', PICKS.map(([n, label]) =>
    `<button type="button" aria-pressed="${n === number}" onclick="location.search='?ticket=${n}'">${label}</button>`).join(''));
  $('back').href += `?ticket=${number}`;
  $('nav-title').textContent = number;
  $('card').innerHTML = R.ticketCard(t, `C508-request-detail.html?ticket=${number}`);

  /* the customer's tag says Please confirm; a colleague reads it as done */
  const status = t.status === 'completed' ? 'Work completed' : R.ticketTag(t.status).replace(/<[^>]+>/g, '');
  $('summary').textContent = [
    `Zixom service request ${t.number}`,
    `Machine: ${m.model}${m.nickname ? ` (${m.nickname})` : ''}, ${m.serial}`,
    `Site: ${site.name}`,
    `Status: ${status}`,
    `Engineer: ${eng ? eng.name : 'Not assigned yet'}`,
    ...(t.window ? [`Visit: ${R.dayDate(t.window.date)}, ${t.window.slot}`] : []),
  ].join('\n');
})();
</script>
<script src="../../assets/js/ui.js"></script>
</body>
</html>
