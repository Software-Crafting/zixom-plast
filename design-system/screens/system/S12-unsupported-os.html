<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zixom Connect - S12 Unsupported phone software</title>
<link rel="icon" href="../../assets/brand/zixom-logo-small.png">
<link rel="stylesheet" href="../../assets/css/zixom.css">
<style>
.full{flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 24px 130px}
</style>
</head>
<body class="plate">

<div class="plate-label"><b>S12 Unsupported phone software</b><span>launch only</span><span class="plate-tag">PHASE 1</span></div>
<div class="plate-states"><span>phone</span>
  <button type="button" data-state="ready" aria-pressed="true">iPhone</button>
  <button type="button" data-state="android" aria-pressed="false">Android</button>
</div>

<div class="device">
  <div class="screen plain" data-state="ready">
    <div class="status on-light"></div>
    <div class="full">
      <div class="state">
        <span class="disc"><svg class="ic" aria-hidden="true"><use href="#ph-device-mobile"/></svg></span>
        <h3>Phone software too old</h3>
        <p>Update your phone, then open the app again.</p>
      </div>
    </div>
    <div class="footer-bar">
      <button class="btn btn-primary" type="button" data-when="ready">Open App Store page</button>
      <button class="btn btn-primary" type="button" data-when="android">Open Google Play page</button>
    </div>
    <span class="home-indicator"></span>
  </div>
</div>

<p class="plate-note">Blocks the app at launch when the phone software is too old (EC-35); the store page lists supported phones. Rooted phones get <a href="S13-rooted-warning.html">S13</a>.</p>

<script src="../../assets/icons/icons.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/render.js"></script>
<script src="../../assets/js/ui.js"></script>
</body>
</html>
