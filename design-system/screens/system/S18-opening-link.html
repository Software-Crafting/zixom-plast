<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zixom Connect - S18 Opening link</title>
<link rel="icon" href="../../assets/brand/zixom-logo-small.png">
<link rel="stylesheet" href="../../assets/css/zixom.css">
<style>
.full{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 24px 170px; text-align:center}
.spinner{width:52px; height:52px; border-radius:50%; border:4px solid var(--slate-100); border-top-color:var(--slate-800); animation:spin .9s linear infinite}
.full h3{margin:22px 0 0; font:400 var(--fs-18) var(--font-display); color:var(--slate-900)}
.full p{margin:8px 0 0; font-size:var(--fs-14); line-height:1.5; color:var(--text)}
</style>
</head>
<body class="plate">

<div class="plate-label"><b>S18 Opening link</b><span>link or notification</span><span class="plate-tag">PHASE 1</span></div>
<div class="plate-states"><span>time</span>
  <button type="button" data-state="ready" aria-pressed="true">resolving</button>
  <button type="button" data-state="slow" aria-pressed="false">over 5 seconds</button>
</div>

<div class="device">
  <div class="screen plain" data-state="ready">
    <div class="status on-light"></div>
    <div class="full">
      <span class="spinner" role="progressbar" aria-label="Opening TKT-2026-0123" data-when="ready"></span>
      <div class="state" style="padding:0" data-when="slow"><span class="disc"><svg class="ic" aria-hidden="true"><use href="#ph-hourglass"/></svg></span></div>
      <h3>Opening <span class="mono">TKT-2026-0123</span></h3>
      <p data-when="ready">Engineer assigned</p>
      <p data-when="slow">Taking longer than usual.</p>
    </div>
    <div class="footer-bar" data-when="slow">
      <div class="stack-sm">
        <button class="btn btn-primary" type="button" data-busy><svg class="ic" aria-hidden="true"><use href="#ph-arrows-clockwise"/></svg>Retry</button>
        <a class="btn btn-secondary" href="../customer/C101-home.html">Go to Home</a>
      </div>
    </div>
    <span class="home-indicator"></span>
  </div>
</div>

<p class="plate-note">Loading while a link or notification resolves; gone opens <a href="S05-not-found.html">S05</a>, unreadable opens <a href="S08-invalid-link.html">S08</a>. After 5 seconds it offers Retry.</p>

<script src="../../assets/icons/icons.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/render.js"></script>
<script src="../../assets/js/ui.js"></script>
</body>
</html>
