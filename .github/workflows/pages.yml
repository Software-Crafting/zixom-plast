# Publishes the prototypes in design-system/ to GitHub Pages: the mobile app (index.html) and the admin dashboard
# (admin/index.html). Build tools are left out.
# Build and deploy are separate jobs: the deploy job only sees the artifact once the build job has finished.
name: Pages

on:
  push:
    branches: [main]
    paths: ['design-system/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copy the prototypes
        run: rsync -a --exclude tools --exclude README.md design-system/ _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
